<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10171d" />
    <title>PlaceGame Console</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PLACEGAME</p>
          <h1>Operator console</h1>
        </div>
        <button id="logout" class="quiet hidden" type="button">Sign out</button>
      </header>

      <section id="notice" class="notice" role="status" aria-live="polite"></section>

      <section id="auth-panel" class="panel auth-panel" aria-labelledby="auth-title">
        <p class="eyebrow" id="auth-mode">ACCESS</p>
        <h2 id="auth-title">Sign in</h2>
        <p id="auth-copy" class="muted">Use the administrator password for this server.</p>
        <form id="auth-form">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button id="auth-submit" class="primary" type="submit">Sign in</button>
        </form>
      </section>

      <section id="console" class="hidden" aria-labelledby="accounts-title">
        <section class="panel create-panel" aria-labelledby="create-title">
          <p class="eyebrow">ADD ACCOUNT</p>
          <h2 id="create-title">Create game account</h2>
          <p class="muted">Credentials are verified once and are never displayed again.</p>
          <form id="account-create-form" class="account-form">
            <div class="field">
              <label for="account-label">Label</label>
              <input id="account-label" name="label" maxlength="120" required />
            </div>
            <div class="field">
              <label for="account-auth-mode">Authentication</label>
              <select id="account-auth-mode" name="authMode">
                <option value="credentials">Username and password</option>
                <option value="token_only">Session token</option>
              </select>
            </div>
            <div id="account-username-field" class="field">
              <label for="account-username">Game username</label>
              <input id="account-username" name="username" autocomplete="username" />
            </div>
            <div id="account-password-field" class="field">
              <label for="account-password">Game password</label>
              <input id="account-password" name="password" type="password" autocomplete="new-password" />
            </div>
            <div id="account-token-field" class="field hidden">
              <label for="account-token">Session token</label>
              <input id="account-token" name="sessionToken" type="password" autocomplete="off" />
            </div>
            <button id="account-create-submit" class="primary" type="submit">Create account</button>
          </form>
        </section>

        <div class="section-heading">
          <div>
            <p class="eyebrow">ACCOUNTS</p>
            <h2 id="accounts-title">Game accounts</h2>
          </div>
          <button id="refresh-all" class="quiet" type="button" title="Refresh account list">Refresh</button>
        </div>
        <div id="accounts" class="account-list" aria-live="polite"></div>
      </section>
    </main>
    <dialog id="edit-dialog" aria-labelledby="edit-dialog-title">
      <form id="edit-form">
        <p class="eyebrow">EDIT ACCOUNT</p>
        <h2 id="edit-dialog-title">Edit game account</h2>
        <div class="field">
          <label for="edit-label">Label</label>
          <input id="edit-label" name="label" maxlength="120" required />
        </div>
        <div id="edit-username-field" class="field">
          <label for="edit-username">Game username (optional)</label>
          <input id="edit-username" name="username" autocomplete="username" />
        </div>
        <div class="field">
          <label id="edit-secret-label" for="edit-secret">New secret (optional)</label>
          <input id="edit-secret" name="secret" type="password" autocomplete="new-password" />
        </div>
        <div class="dialog-actions">
          <button id="edit-cancel" type="submit" value="cancel">Cancel</button>
          <button id="edit-submit" class="primary" type="submit" value="save">Save</button>
        </div>
      </form>
    </dialog>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
