<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10171d" />
    <title>PlaceGame 控制台</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PLACEGAME</p>
          <h1>运维控制台</h1>
        </div>
        <div class="topbar-actions">
          <button id="change-password" class="quiet hidden" type="button">修改密码</button>
          <button id="logout" class="quiet hidden" type="button">退出登录</button>
        </div>
      </header>

      <section id="notice" class="notice" role="status" aria-live="polite"></section>

      <section id="auth-panel" class="panel auth-panel" aria-labelledby="auth-title">
        <p class="eyebrow" id="auth-mode">访问</p>
        <h2 id="auth-title">登录</h2>
        <p id="auth-copy" class="muted">请输入本服务器的管理员密码。</p>
        <form id="auth-form">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button id="auth-submit" class="primary" type="submit">登录</button>
        </form>
      </section>

      <section id="console" class="hidden" aria-labelledby="accounts-title">
        <section class="panel create-panel" aria-labelledby="create-title">
          <p class="eyebrow">添加账号</p>
          <h2 id="create-title">创建游戏账号</h2>
          <p class="muted">凭据仅在创建时校验一次，之后不会再次显示。</p>
          <form id="account-create-form" class="account-form">
            <div class="field">
              <label for="account-label">名称</label>
              <input id="account-label" name="label" maxlength="120" required />
            </div>
            <div class="field">
              <label for="account-auth-mode">认证方式</label>
              <select id="account-auth-mode" name="authMode">
                <option value="credentials">用户名与密码</option>
                <option value="token_only">会话令牌</option>
              </select>
            </div>
            <div id="account-username-field" class="field">
              <label for="account-username">游戏用户名</label>
              <input id="account-username" name="username" autocomplete="username" />
            </div>
            <div id="account-password-field" class="field">
              <label for="account-password">游戏密码</label>
              <input id="account-password" name="password" type="password" autocomplete="new-password" />
            </div>
            <div id="account-token-field" class="field hidden">
              <label for="account-token">会话令牌</label>
              <input id="account-token" name="sessionToken" type="password" autocomplete="off" />
            </div>
            <button id="account-create-submit" class="primary" type="submit">创建账号</button>
          </form>
        </section>

        <div class="section-heading">
          <div>
            <p class="eyebrow">账号列表</p>
            <h2 id="accounts-title">游戏账号</h2>
          </div>
          <button id="refresh-all" class="quiet" type="button" title="刷新账号列表">刷新</button>
        </div>
        <div id="accounts" class="account-list" aria-live="polite"></div>
      </section>
    </main>
    <dialog id="edit-dialog" aria-labelledby="edit-dialog-title">
      <form id="edit-form">
        <p class="eyebrow">编辑账号</p>
        <h2 id="edit-dialog-title">编辑游戏账号</h2>
        <div class="field">
          <label for="edit-label">名称</label>
          <input id="edit-label" name="label" maxlength="120" required />
        </div>
        <div id="edit-username-field" class="field">
          <label for="edit-username">游戏用户名（可选）</label>
          <input id="edit-username" name="username" autocomplete="username" />
        </div>
        <div class="field">
          <label id="edit-secret-label" for="edit-secret">新密钥（可选）</label>
          <input id="edit-secret" name="secret" type="password" autocomplete="new-password" />
        </div>
        <div class="dialog-actions">
          <button id="edit-cancel" type="submit" value="cancel">取消</button>
          <button id="edit-submit" class="primary" type="submit" value="save">保存</button>
        </div>
      </form>
    </dialog>
    <dialog id="password-dialog" aria-labelledby="password-dialog-title">
      <form id="password-form">
        <p class="eyebrow">账号安全</p>
        <h2 id="password-dialog-title">修改管理员密码</h2>
        <div class="field">
          <label for="current-password">当前密码</label>
          <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="new-password">新密码</label>
          <input id="new-password" name="newPassword" type="password" autocomplete="new-password" required />
        </div>
        <p class="muted">修改后所有已登录的会话都会失效，包括当前这个，需要重新登录。</p>
        <div class="dialog-actions">
          <button id="password-cancel" type="submit" value="cancel">取消</button>
          <button id="password-submit" class="primary" type="submit" value="save">保存</button>
        </div>
      </form>
    </dialog>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
