name: Release ARM64 image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/fengzaixing401/placegame-mcp

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Save image digest artifact
        run: printf '%s\n' "ghcr.io/fengzaixing401/placegame-mcp@${{ steps.build.outputs.digest }}" > image-digest.txt
      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
      - name: Smoke test published ARM64 image
        shell: bash
        run: |
          master_key="$(openssl rand -base64 32)"
          mcp_token="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker run --platform linux/arm64 --detach --name placegame-release-smoke \
            --env PLACEGAME_MASTER_KEY_B64="$master_key" \
            --env PLACEGAME_MCP_TOKEN="$mcp_token" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
          trap 'docker rm --force placegame-release-smoke || true' EXIT
          for attempt in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' placegame-release-smoke)"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' placegame-release-smoke)" = healthy
          docker exec -i placegame-release-smoke python - <<'PY'
          import urllib.error
          import urllib.request

          request = urllib.request.Request("http://127.0.0.1:8000/mcp", method="GET")
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError("unauthenticated MCP request was accepted")
          PY
