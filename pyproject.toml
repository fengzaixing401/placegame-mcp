[project]
name = "placegame-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "httpx>=0.27,<1", "cryptography>=43,<45",
  "argon2-cffi>=23.1,<26", "pyotp>=2.9,<3", "mcp>=1.29,<2", "structlog>=24,<26",
  "tzdata>=2025.2,<2027",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.115,<7",
  "respx>=0.22,<1", "pyright>=1.1.390,<2", "pyyaml>=6,<7", "testcontainers[postgres]>=4.8,<5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that require PostgreSQL through PLACEGAME_TEST_DATABASE_URL or Docker",
]

[tool.setuptools.packages.find]
where = ["src"]
